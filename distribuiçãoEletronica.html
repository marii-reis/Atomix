<html>
    <head>
      <link rel="stylesheet" href="/style.css">
    </head>
    <body>
      <header class="cabecalho">
        <nav>
            <ul class="menu">
            <li><a href="/">Início</a></li>
            </ul>
        </nav>
        </header>
        <main>
        <div class="card">
            <div class="card-topo">
              <span class="card-icone">🧬</span>
              <h2 class="card-titulo">Distribuição Eletrônica</h2>
            </div>
    
            <p class="card-descricao">
            Calcule  como os elétrons se organizam ao redor do núcleo de um átomo.
            </p>

            <form method="POST">    
            <div class="campo-grupo">
              <label class="campo-label">
                Digite aqui o número atômico:
              </label>
              <input
                class="campo-input"
                step="any"
                min="1"
                max="118"
                name="numero_atomico"
              />
            </div>
    
    
            <button class="botao">
              Distribuir
            </button>
            </form>
            {% if resultado %}
            <div class="resultado" id="resultado-massa">
                {{ resultado }}
            </div>
            {% endif %}
        <div class="imagem-container">
             <img src="distribuicaoletronica.webp" width="5000">
        </div>
    </main>
    </body>
</html>
