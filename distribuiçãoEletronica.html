<html>
    <head>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main>
        <div class="card">
            <div class="card-topo">
              <span class="card-icone">🧬</span>
              <h2 class="card-titulo">Distribuição Eletrônica</h2>
            </div>
    
            <p class="card-descricao">
            Calcule  como os elétrons se organizam ao redor do núcleo de um átomo.
            </p>

    
    
            <div class="campo-grupo">
              <label class="campo-label" for="composto">
                Número atômico:
              </label>
            </div>
    
            <div class="campo-grupo">
              <label class="campo-label" for="moles">
                Digite aqui o número atômico:
              </label>
              <input
                class="campo-input"
                step="any"
                min="0"
              />
            </div>
    
    
            <button class="botao">
              Distribuir
            </button>
    
            <div class="resultado" id="resultado-massa">
              O resultado aparecerá aqui.
            </div>
          </div>
        </div>
        <div class="imagem-container">
             <img src="distribuicaoletronica.webp" width="5000">
        </div>
    </main>
    </body>
</html>
