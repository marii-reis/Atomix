<html>
    <head>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main>
        <div class="card">
            <div class="card-topo">
              <span class="card-icone">⚖️</span>
              <h2 class="card-titulo">Balanceamento de Equações</h2>
            </div>
    
            <p class="card-descricao">
              Ajuste os coeficientes das equações para igualar o número de átomos.
            </p>
    
    
            <div class="formula">
              <span class="formula-texto"> C + O₂ → CO₂ </span>
            </div>
    
            <div class="campo-grupo">
              <label class="campo-label" for="moles">
                Digite as equações a serem balanceadas
              </label>
              <input
                class="campo-input""
                placeholder="Lembre-se de digitar o (+) entre elas"
                step="any"
              />
            </div>
    
            <button class="botao">
              Balancear
            </button>
    
            <div class="resultado" id="resultado-massa">
              O resultado aparecerá aqui.
            </div>
          </div>
        </div>
    </main>
    </body>
</html>
