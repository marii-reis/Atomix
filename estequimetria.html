<html>
    <head>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main>
        <div class="card">
            <div class="card-topo">
              <span class="card-icone">⚖️</span>
              <h2 class="card-titulo">Estequiometria</h2>
            </div>
    
            <p class="card-descricao">
              Calcule as quantidades de reagentes e produtos em uma reação química.
            </p>

    
    
            <div class="campo-grupo">
              <label class="campo-label" for="composto">
                Fórmula química:
              </label>
            </div>
    
            <div class="campo-grupo">
              <label class="campo-label" for="moles">
                Digite aqui a fórmula química:
              </label>
              <input
                class="campo-input"
                step="any"
                min="0"
              />
            </div>
    
    
            <button class="botao">
              Calcular
            </button>
    
            <div class="resultado" id="resultado-massa">
              O resultado aparecerá aqui.
            </div>
          </div>
        </div>
        <div class="imagem-container">
             <img src="estequiometria.webp" width="5000">
        </div>
    </main>
    </body>
</html>
