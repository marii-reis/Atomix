<html>
    <head>
        <link rel="stylesheet" href="style.css"> 
    </head>
    <body>
        <main>
            <div class="card">
                <div class="card-topo">
                  <span class="card-icone">🧫</span>
                  <h2 class="card-titulo">Química Orgânica</h2>
                </div>
        
                <p class="card-descricao">
                  Descubra os compostos presentes na sua imagem.
                </p>
                <label for="imagem" class="upload-box">
                    Arraste ou faça o upload da imagem
                </label>
                
                <input type="file" id="imagem" accept="image/*" style="display:none;">
                <div class="resultado">
                    Os compostos aparecerão aqui.
                  </div>
    </body>
</html>
